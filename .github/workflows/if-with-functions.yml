name: Nice If example
on:
    push:
        branches:
            - main
            - develop
            - feature/**
jobs:
    quality_checks:
        if: startsWith(github.ref_name, 'feature')  && github.event_name == 'push'
        runs-on: ubuntu-22.04
        steps:
            - name: Run quality checks
              run: |
                echo "Running quality checks on the codebase"
                exit 1

    dev_deploy:
        if: github.ref_name == 'develop' && github.event_name == 'push'
        runs-on: ubuntu-22.04
        steps:
            - name: Deploy to development environment
              run: echo "Deploying to development environment"

    prod_deploy:
        if: github.ref_name == 'main' && github.event_name == 'push'
        runs-on: ubuntu-22.04
        steps:
            - name: Deploy to production environment
              run: echo "Deploying to production environment"

    success_notify:
        needs: [quality_checks, dev_deploy, prod_deploy]
        if: always() && !failure()
        runs-on: ubuntu-22.04
        steps:
            - name: Notify success
              run: echo "All jobs completed successfully"

    failure_notify:
        needs: [quality_checks, dev_deploy, prod_deploy]
        if: failure()
        runs-on: ubuntu-22.04
        steps:
            - name: Notify failure
              run: echo "One or more jobs failed"