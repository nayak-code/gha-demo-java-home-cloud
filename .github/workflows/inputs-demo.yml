name: Input variables
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Choose the environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stage
          - prod
      artifact_tag: 
        description: Choose the artifact for deployment
        required: true
jobs:
  input_demo:
     runs-on: ubuntu-latest
     steps:
       - name: Deploy the App
         run: echo "Deploying the application ${{ inputs.artifact_tag }} to ${{ inputs.environment }}"
