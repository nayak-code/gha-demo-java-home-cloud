name: output demo for github actions
on: push
jobs:
  job1:
    runs-on: ubuntu:latest
    steps:
      - name: Step one for output
        id: step1
        run: echo "version=0.0.1" >> $GITHUB_OUTPUT
      - name: step two to call the output
        run: echo "This version is ${{ steps.step1.outputs.version }}"
